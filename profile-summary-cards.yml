# Salve este arquivo em: .github/workflows/profile-summary-cards.yml
#
# Pré-requisitos (uma vez só):
#   1. Crie um Personal Access Token: https://github.com/settings/personal-access-tokens/new
#      - Fine-grained PAT: Repository access = "Public repositories (read-only)"
#      - Para contar atividade de repos privados: Repository access = "All repositories"
#        com Contents/Issues/Pull requests/Metadata = read
#   2. No repo Douglasproglima/Douglasproglima:
#      Settings > Secrets and variables > Actions > New repository secret
#      Nome: SUMMARY_GITHUB_TOKEN
#   3. Actions > GitHub-Profile-Summary-Cards > Run workflow (primeira execução manual)

name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # Todo dia às 03:00 UTC (00:00 em Brasília).
    # Obs: o exemplo oficial usa "* */24 * * *", que na prática dispara 60x à meia-noite.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

          # IMPORTANTE: o default da action é "main". Seu repo de perfil usa "master".
          BRANCH_NAME: "master"

          # Fuso de Brasília, usado no card de horário produtivo.
          UTC_OFFSET: "-3"

          # Gera só o tema dracula. Deixe "" para gerar todos os 16 temas
          # (cria 16 pastas no repo — provavelmente não é o que você quer).
          THEME: "dracula"

          # Linguagens a excluir dos gráficos, separadas por vírgula. Ex: "html,css"
          EXCLUDE: ""

          AUTO_PUSH: true
